name: ci
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GHIDRA_INSTALL_DIR: /home/runner/ghidra

jobs:
  build_and_test:
    name: Build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ghidra_version: "12.1.3"
            ghidra_build_date: "20260817"
            ghidra_sha256: "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54"
    env:
      GHIDRA_VERSION: ${{ matrix.ghidra_version }}
      GHIDRA_BUILD_DATE: ${{ matrix.ghidra_build_date }}
      GHIDRA_SHA256: ${{ matrix.ghidra_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Install Ghidra
        run: .github/scripts/install_ghidra.sh
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-sm83_Ghidra_${{ matrix.ghidra_version }}
          path: build/distributions/*_ghidra-sm83.zip
          if-no-files-found: 'error'
  release:
    if: github.ref_type == 'tag'
    name: Create draft release
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create release and upload distribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create --verify-tag --generate-notes --draft "${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" ghidra-sm83_Ghidra_*/*.zip
